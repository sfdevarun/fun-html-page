<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lunch Approval</title>
  <meta name="description" content="A fun little hangout invite for a friend." />
  <style>
    :root {
      --bg1: #f0f9ff;
      --bg2: #e0f2fe;
      --card: rgba(255, 255, 255, 0.8);
      --text: #3f3f46;
      --accent: #0284c7;
      --accent-dark: #0369a1;
      --yes: #16a34a;
      --yes-dark: #15803d;
      --no: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top right, var(--bg2), var(--bg1));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(560px, 92vw);
      background: var(--card);
      backdrop-filter: blur(8px);
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(3, 105, 161, 0.15);
      padding: 26px 22px 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 2.4vw, 2rem);
      color: var(--accent-dark);
    }

    p {
      margin: 0 0 18px;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    img {
      width: min(250px, 70vw);
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
      margin: 8px auto 18px;
      display: block;
    }

    .buttons {
      position: relative;
      height: 160px;
      margin-top: 2px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.2s ease;
      color: white;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.14);
    }

    #yesBtn {
      background: linear-gradient(90deg, var(--yes), var(--yes-dark));
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 2;
    }

    #yesBtn:hover {
      transform: translateY(-2px);
    }

    #noBtn {
      background: linear-gradient(90deg, #9ca3af, var(--no));
      position: absolute;
      right: 12px;
      bottom: 12px;
      pointer-events: none;
      user-select: none;
      z-index: 1;
      transition: left 0.08s linear, top 0.08s linear;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hi Sanjana 😊</h1>
    <p>Monday lunch? I already told my calendar you’re the important meeting.</p>
    <img src="https://media.tenor.com/zGm5acSjHCIAAAAM/cat-begging.gif" alt="Cute cat asking to hang out" />

    <div class="buttons">
      <button id="yesBtn">YESSS! 🎉</button>
      <button id="noBtn">NO 🙈</button>
    </div>
  </main>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const buttonsWrap = document.querySelector(".buttons");

    noBtn.setAttribute("tabindex", "-1");
    noBtn.setAttribute("aria-hidden", "true");

    const BUTTON_GAP = 16;

    function overlapsYes(left, top, noWidth, noHeight) {
      const yesLeft = yesBtn.offsetLeft;
      const yesTop = yesBtn.offsetTop;
      const yesRight = yesLeft + yesBtn.offsetWidth;
      const yesBottom = yesTop + yesBtn.offsetHeight;
      const noRight = left + noWidth;
      const noBottom = top + noHeight;

      return !(
        noRight + BUTTON_GAP <= yesLeft ||
        left >= yesRight + BUTTON_GAP ||
        noBottom + BUTTON_GAP <= yesTop ||
        top >= yesBottom + BUTTON_GAP
      );
    }

    function setNoPosition(left, top) {
      noBtn.style.left = `${left}px`;
      noBtn.style.top = `${top}px`;
      noBtn.style.right = "auto";
      noBtn.style.bottom = "auto";
      noBtn.style.transform = "none";
    }

    function moveNoButtonAway() {
      if (!buttonsWrap) {
        return;
      }

      const wrapWidth = buttonsWrap.clientWidth;
      const wrapHeight = buttonsWrap.clientHeight;
      const noWidth = noBtn.offsetWidth;
      const noHeight = noBtn.offsetHeight;
      const maxLeft = Math.max(0, wrapWidth - noWidth);
      const maxTop = Math.max(0, wrapHeight - noHeight);

      for (let attempt = 0; attempt < 80; attempt += 1) {
        const left = Math.random() * maxLeft;
        const top = Math.random() * maxTop;

        if (!overlapsYes(left, top, noWidth, noHeight)) {
          setNoPosition(left, top);
          return;
        }
      }

      const yesLeft = yesBtn.offsetLeft;
      const yesTop = yesBtn.offsetTop;
      const yesRight = yesLeft + yesBtn.offsetWidth;
      const yesBottom = yesTop + yesBtn.offsetHeight;
      const fallbacks = [
        { left: yesRight + BUTTON_GAP, top: yesTop },
        { left: yesLeft - noWidth - BUTTON_GAP, top: yesTop },
        { left: yesLeft, top: yesBottom + BUTTON_GAP },
        { left: yesLeft, top: yesTop - noHeight - BUTTON_GAP },
        { left: maxLeft, top: 0 },
        { left: 0, top: maxTop },
        { left: maxLeft, top: maxTop },
        { left: 0, top: 0 },
      ];

      for (const spot of fallbacks) {
        const left = Math.min(maxLeft, Math.max(0, spot.left));
        const top = Math.min(maxTop, Math.max(0, spot.top));

        if (!overlapsYes(left, top, noWidth, noHeight)) {
          setNoPosition(left, top);
          return;
        }
      }

      setNoPosition(yesLeft < wrapWidth / 2 ? maxLeft : 0, yesTop < wrapHeight / 2 ? maxTop : 0);
    }

    document.addEventListener("mousemove", (event) => {
      if (window.innerWidth <= 450) {
        return;
      }

      const noRect = noBtn.getBoundingClientRect();
      const nearestX = Math.max(noRect.left, Math.min(event.clientX, noRect.right));
      const nearestY = Math.max(noRect.top, Math.min(event.clientY, noRect.bottom));
      const dx = event.clientX - nearestX;
      const dy = event.clientY - nearestY;
      const distance = Math.hypot(dx, dy);

      if (distance < 120) {
        moveNoButtonAway();
      }
    });

    document.addEventListener("touchstart", moveNoButtonAway, { passive: true });

    window.addEventListener("load", () => {
      if (overlapsYes(noBtn.offsetLeft, noBtn.offsetTop, noBtn.offsetWidth, noBtn.offsetHeight)) {
        moveNoButtonAway();
      }
    });

    window.addEventListener("resize", () => {
      const maxLeft = Math.max(0, buttonsWrap.clientWidth - noBtn.offsetWidth);
      const maxTop = Math.max(0, buttonsWrap.clientHeight - noBtn.offsetHeight);
      const left = Math.min(maxLeft, Math.max(0, noBtn.offsetLeft));
      const top = Math.min(maxTop, Math.max(0, noBtn.offsetTop));
      setNoPosition(left, top);

      if (overlapsYes(left, top, noBtn.offsetWidth, noBtn.offsetHeight)) {
        moveNoButtonAway();
      }
    });

    yesBtn.addEventListener("click", () => {
      alert("Confirmed. Please arrive with gossips and an empty stomach Sanjana 🎉");
    });

  </script>
</body>
</html>
